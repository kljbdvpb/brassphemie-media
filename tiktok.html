<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>TikTok-Paket</title><style>
body{font-family:Inter,system-ui,sans-serif;background:#1B2A41;color:#F3ECDD;margin:0;padding:16px}
h1{font-size:22px} h2{font-size:16px;color:#C8962E} section{margin:0 0 32px}
.row{display:flex;gap:8px;overflow-x:auto} .row img{height:220px;border-radius:8px}
textarea{width:100%;height:84px;margin-top:8px;border-radius:8px;border:0;padding:8px;font:14px Inter,system-ui}
.hint{font-size:13px;opacity:.7}
.btns{display:flex;gap:8px;margin-top:10px} .btns button,.btns a{background:#F2703F;color:#1F2D4F;border:0;border-radius:10px;padding:12px 14px;font:700 14px Inter,system-ui;text-decoration:none}
.btns a.zip{background:#F3ECDF} .btns button.copy{background:#F3ECDF}</style></head><body>
<h1>Brassphemie – TikTok-Paket</h1><p>Keine TikTok-Posts in den nächsten 10 Tagen.</p>
<script>
document.querySelectorAll('button.share').forEach(function(b){b.addEventListener('click',async function(){
  var urls=JSON.parse(b.dataset.urls),old=b.textContent;b.textContent='Lade …';
  try{
    var files=await Promise.all(urls.map(async function(u,i){var r=await fetch(u);var bl=await r.blob();return new File([bl],String(i+1).padStart(2,'0')+'.jpg',{type:'image/jpeg'});}));
    if(navigator.canShare&&navigator.canShare({files:files})){await navigator.share({files:files});}
    else{alert('Teilen wird hier nicht unterstützt – bitte den ZIP-Button nutzen.');}
  }catch(e){if(e&&e.name!=='AbortError')alert('Teilen fehlgeschlagen – bitte ZIP nutzen.');}
  b.textContent=old;});});
document.querySelectorAll('button.copy').forEach(function(b){b.addEventListener('click',function(){
  var t=b.closest('section').querySelector('textarea').value;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){b.textContent='Kopiert ✓';}).catch(function(){b.closest('section').querySelector('textarea').select();});});});
</script></body></html>
